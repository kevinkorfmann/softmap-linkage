site_name: SoftMap
site_description: Confidence-aware linkage mapping from probabilistic inheritance states
repo_url: https://github.com/kevinkorfmann/softmap-linkage
theme:
  name: material
  palette:
    scheme: default
    primary: teal
    accent: amber
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Case studies: case-studies.md
  - Quick start: quickstart.md
  - Step-by-step guide: guide.md
  - Input data: data.md
  - Algorithm: algorithm.md
  - Plotting: plotting.md
  - API: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
