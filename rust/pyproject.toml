[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "softmap-rust"
version = "0.1.0"
description = "Optional numerical kernels for SoftMap"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
license = "MIT"

[tool.maturin]
module-name = "_softmap_rust"
manifest-path = "Cargo.toml"
