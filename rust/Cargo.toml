[package]
name = "softmap-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional numerical kernels for SoftMap"
publish = false

[lib]
name = "_softmap_rust"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.11"

[profile.release]
codegen-units = 1
lto = "thin"
