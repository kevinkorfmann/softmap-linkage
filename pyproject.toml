[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "softmap-linkage"
version = "0.1.0"
description = "Confidence-first linkage mapping from probabilistic genotypes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pysam>=0.23", "scipy>=1.14"]
license = "MIT"

[project.urls]
Repository = "https://github.com/kevinkorfmann/softmap-linkage"
Documentation = "https://kevinkorfmann.github.io/softmap-linkage/"

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27", "matplotlib>=3.9"]
test = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[project.scripts]
softmap = "softmap.cli:main"

[tool.setuptools.packages.find]
include = ["softmap*"]

[tool.coverage.run]
source = ["softmap"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "C4", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
